name: Deploy ARC Runner Scale Set

on:
  workflow_call:
    inputs:
      image_full_tag:
        description: "Full image tag of the runner (ghcr.io/org/image:tag)"
        required: true
        type: string
      arc_runner_set_name:
        description: "Helm release name of the runner scale set"
        required: false
        type: string
        default: "arc-runner-set"
      arc_namespace:
        description: "Kubernetes namespace for the runners"
        required: false
        type: string
        default: "arc-runners"
      arc_system_namespace:
        description: "Namespace of the ARC controller"
        required: false
        type: string
        default: "arc-system"
      github_config_url:
        description: "GitHub organization or repository URL for ARC"
        required: true
        type: string
      values_yaml_path:
        description: "Path to the values.yaml to update"
        required: false
        type: string
        default: "./arc-runner-image/values.yaml"
      use_pat:
        type: boolean
        required: false
        default: false
      use_github_app:
        type: boolean
        required: false
        default: true

    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true
      AKS_RESOURCE_GROUP:
        required: true
      AKS_CLUSTER_NAME:
        required: true
      ARC_GITHUB_TOKEN:
        required: false
      ARC_GITHUB_APP_ID:
        required: false
      ARC_GITHUB_APP_INSTALLATION_ID:
        required: false
      ARC_GITHUB_APP_PRIVATE_KEY:
        required: false

jobs:
  deploy-arc-runner:
    name: Deploy ARC Runner on AKS
    runs-on: ubuntu-latest
    environment: production

    steps:
      # ---------------------------------------------------------------- #
      # 1. Checkout
      # ---------------------------------------------------------------- #
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------- #
      # 2. Azure Login (OIDC)
      # ---------------------------------------------------------------- #
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ---------------------------------------------------------------- #
      # 3. Set kubeconfig for AKS
      # ---------------------------------------------------------------- #
      - name: Set kubeconfig for AKS
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      # ---------------------------------------------------------------- #
      # 4. Create ARC namespaces
      # ---------------------------------------------------------------- #
      - name: Create ARC namespaces
        uses: org-test-reply-1/platform-actions/create-namespaces@main
        with:
          namespaces: "${{ inputs.arc_system_namespace }},${{ inputs.arc_namespace }}"

      # ---------------------------------------------------------------- #
      # 5. Deploy ARC Controller (once)
      # ---------------------------------------------------------------- #
      - name: Deploy ARC Controller
        uses: org-test-reply-1/platform-actions/deploy-arc-controller@main
        with:
          arc_system_namespace: ${{ inputs.arc_system_namespace }}

      # ---------------------------------------------------------------- #
      # 6. Create Kubernetes secret (PAT)
      # ---------------------------------------------------------------- #
      - name: Create Kubernetes secret (PAT)
        if: ${{ inputs.use_pat }}
        run: |
          kubectl create secret generic arc-github-secret \
            --namespace ${{ inputs.arc_namespace }} \
            --from-literal=github_token='${{ secrets.ARC_GITHUB_TOKEN }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "PAT secret applied."

      # ---------------------------------------------------------------- #
      # 6. Create Kubernetes secret (GitHub App)
      # ---------------------------------------------------------------- #
      - name: Create Kubernetes secret (GitHub App)
        if: ${{ inputs.use_github_app }}
        env:
          PRIVATE_KEY: ${{ secrets.ARC_GITHUB_APP_PRIVATE_KEY }}
        run: |
          printf '%s' "$PRIVATE_KEY" > /tmp/arc-app-key.pem

          kubectl delete secret arc-github-secret \
            --namespace ${{ inputs.arc_namespace }} \
            --ignore-not-found=true

          kubectl create secret generic arc-github-secret \
            --namespace ${{ inputs.arc_namespace }} \
            --from-literal=github_app_id='${{ secrets.ARC_GITHUB_APP_ID }}' \
            --from-literal=github_app_installation_id='${{ secrets.ARC_GITHUB_APP_INSTALLATION_ID }}' \
            --from-file=github_app_private_key=/tmp/arc-app-key.pem

          rm -f /tmp/arc-app-key.pem
          echo "GitHub App secret applied."

      # ---------------------------------------------------------------- #
      # 7. Deploy ARC (composite action)
      # ---------------------------------------------------------------- #
      - name: Deploy ARC
        uses: org-test-reply-1/platform-actions/deploy-arc@main
        with:
          arc_system_namespace: ${{ inputs.arc_system_namespace }}
          arc_namespace: ${{ inputs.arc_namespace }}
          arc_runner_set_name: ${{ inputs.arc_runner_set_name }}
          values_yaml_path: ${{ inputs.values_yaml_path }}

      # ---------------------------------------------------------------- #
      # 8. Verify runner pods
      # ---------------------------------------------------------------- #
      - name: Verify runner pods
        run: |
          echo "=== Pods in ${{ inputs.arc_namespace }} ==="
          kubectl get pods -n ${{ inputs.arc_namespace }}

          echo "=== Pods in ${{ inputs.arc_system_namespace }} ==="
          kubectl get pods -n ${{ inputs.arc_system_namespace }}

          kubectl wait pod \
            --for=condition=Ready \
            --selector=app.kubernetes.io/name=gha-rs-set \
            --namespace ${{ inputs.arc_system_namespace }} \
            --timeout=180s || true

      # ---------------------------------------------------------------- #
      # 9. Summary
      # ---------------------------------------------------------------- #
      - name: Deploy summary
        if: always()
        run: |
          echo "### ARC Deploy complete" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${{ inputs.image_full_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner Set | \`${{ inputs.arc_runner_set_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Namespace | \`${{ inputs.arc_namespace }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cluster | \`${{ secrets.AKS_CLUSTER_NAME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Config URL | ${{ inputs.github_config_url }} |" >> "$GITHUB_STEP_SUMMARY"
